[project]
name = "oapi-gen-workspace"
version = "0.1.10"
description = "oapi-gen multi-package repository"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.config-settings-package]
# Expose the src -> oapi_gen mapping to static type checkers as well as Python.
oapi-gen = { editable_mode = "strict" }

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oapi-gen-dishka"
version = "0.1.11"
description = "Request-scoped Dishka injection for oapi-gen handlers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["dishka>=1.10.1,<2", "starlette>=1.0,<2"]

[dependency-groups]
dev = [
  "basedpyright==1.40.2",
  "httpx2==2.16.2",
  "oapi-gen",
  "pytest==9.2.0",
  "ruff==0.17.6",
]

[tool.uv.sources]
oapi-gen = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oapi_gen_dishka = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
extend = "../oapi-gen/pyproject.toml"

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
